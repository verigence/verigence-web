name: Repair responsive visual harness

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/fix-visual-harness.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Patch test-only geolocation setup and remove repair workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/visual-validation.yml')
          text = path.read_text(encoding='utf-8')
          old = """          async function installAuth(page) {\n            await routeJson(page, '**/security/v1/auth/login', fakeLogin);\n            await routeJson(page, '**/security/v1/auth/refresh', fakeLogin);\n          }\n"""
          new = """          async function installAuth(page) {\n            await page.context().grantPermissions(['geolocation'], { origin: base });\n            await page.context().setGeolocation({\n              latitude: 28.6139,\n              longitude: 77.2090,\n              accuracy: 20,\n            });\n            await routeJson(page, '**/security/v1/auth/login', fakeLogin);\n            await routeJson(page, '**/security/v1/auth/refresh', fakeLogin);\n          }\n"""
          if old not in text:
              raise SystemExit('Expected visual harness auth block was not found; refusing broad rewrite.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-visual-harness.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/visual-validation.yml
          git commit -m 'test(ui): grant geolocation in responsive harness'
          git pull --rebase origin dev
          git push origin HEAD:dev
