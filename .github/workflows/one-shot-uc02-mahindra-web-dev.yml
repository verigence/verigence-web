name: One-shot UC02 Mahindra Web DEV

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/one-shot-uc02-mahindra-web-dev.yml

permissions:
  contents: write
  deployments: write

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEV_WEB_URL: https://verigence-web-dev.jbrconsulting-it.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build current dev
        run: npm run build
        env:
          VITE_SECURITY_BASE_URL: ""
          VITE_AUDIT_CORE_BASE_URL: ${{ secrets.AUDIT_CORE_URL }}
          VITE_AUDIT_CORE_PROXY_BASE_URL: /audit-core
      - name: Verify Mahindra UI is in built bundle
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q 'Mahindra Masters' dist/assets
          grep -R -q 'Discount & Policy Master' dist/assets
          grep -R -q 'Booking, commercial and trade-in rule parameters' dist/assets
          grep -R -q 'No Segment choices are configured for this OEM' dist/assets
          echo 'UC02_MAHINDRA_LOCAL_BUNDLE=PASS'
      - name: Deploy current dev to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify deployed Mahindra UI bundle
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error --location --output /tmp/page.html "$DEV_WEB_URL/login"
          asset_path="$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/page.html | head -n 1 | sed -E 's/^src="([^"]+)"$/\1/')"
          [ -n "$asset_path" ]
          curl --fail --silent --show-error --location --output /tmp/app.js "$DEV_WEB_URL$asset_path"
          grep -q 'Mahindra Masters' /tmp/app.js
          grep -q 'Discount & Policy Master' /tmp/app.js
          grep -q 'Booking, commercial and trade-in rule parameters' /tmp/app.js
          grep -q 'No Segment choices are configured for this OEM' /tmp/app.js
          echo 'UC02_MAHINDRA_DEPLOYED_BUNDLE=PASS'

  evidence:
    if: always()
    needs: deploy-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Record result and self-clean
        env:
          DEPLOY_RESULT: ${{ needs.deploy-and-verify.result }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/deployments
          cat > docs/deployments/UC02_MAHINDRA_WEB_DEV_LATEST.md <<EOF
          # UC02 Mahindra Web DEV

          - result: $DEPLOY_RESULT
          - source_sha: $GITHUB_SHA
          - run_id: $GITHUB_RUN_ID
          - verified_markers: Mahindra Masters, Discount & Policy Master, segment checkbox UI
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-uc02-mahindra-web-dev.yml
          git add docs/deployments/UC02_MAHINDRA_WEB_DEV_LATEST.md
          git commit -m 'docs(dev): record UC02 Mahindra Web deployment result [skip ci]'
          git pull --rebase origin dev
          git push origin HEAD:dev
