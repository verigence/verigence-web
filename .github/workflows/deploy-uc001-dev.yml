name: Deploy Verigence Web to Cloudflare DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/deploy-uc001-dev.yml'

concurrency:
  group: deploy-verigence-web-dev
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'pull_request' && github.head_ref == 'planning/uc-003-booking-delivery-audit')
    name: Build & Deploy DEV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      SECURITY_UPSTREAM: https://security-dev.up.railway.app
      DEPLOY_SHA: 9eab4bd33cf6ce418c73f43b9b1e594a0343ef65

    steps:
      - name: Checkout exact tested C2 Web revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Identify deployment
        run: |
          echo "Deploying tested Git commit: $DEPLOY_SHA"
          echo "Validation branch: $GITHUB_HEAD_REF"
          echo "Security DEV upstream: $SECURITY_UPSTREAM"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Security DEV upstream
        run: |
          set -euo pipefail
          echo "Checking $SECURITY_UPSTREAM/health/live"
          curl --fail --silent --show-error \
            --header 'Accept: application/json' \
            "$SECURITY_UPSTREAM/health/live"
          echo

      - name: Verify exact approved Verigence logo source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const files = [1, 2, 3, 4].map((part) => `src/assets/lockup.part${part}.ts`);
          const base64 = files.map((file) => {
            const source = fs.readFileSync(file, 'utf8');
            const match = source.match(/^export default '([^']+)'/);
            if (!match) throw new Error(`Cannot read logo base64 from ${file}`);
            return match[1];
          }).join('');
          const image = Buffer.from(base64, 'base64');
          const sha256 = crypto.createHash('sha256').update(image).digest('hex');
          const expected = '6e2c9a9467367a2f35466a7807672379ab3623e535e29e3914d4be731a837f60';
          if (sha256 !== expected) throw new Error(`Approved logo digest mismatch: ${sha256}`);
          if (image.length !== 36060 || image.subarray(0, 8).toString('hex') !== '89504e470d0a1a0a') {
            throw new Error('Approved logo is not the expected 36,060-byte PNG');
          }
          console.log(`VERIGENCE_LOGO_SOURCE=PASS sha256=${sha256} bytes=${image.length}`);
          NODE

      - name: Typecheck and build exact C2 Web revision
        run: npm run build
        env:
          VITE_SECURITY_BASE_URL: ""
          VITE_AUDIT_CORE_BASE_URL: ${{ secrets.AUDIT_CORE_URL }}

      - name: Verify C2 Delivery bundle contract
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q 'delivery/workspace' dist/assets || {
            echo 'C2 Delivery workspace client was not emitted into the production bundle'; exit 1;
          }
          grep -R -q 'CAR_PICTURES' dist/assets || {
            echo 'C2 car-picture evidence contract was not emitted into the production bundle'; exit 1;
          }
          if ! grep -R -q 'data:image/png;base64,' dist/assets; then
            echo 'Approved bundled PNG lockup was not emitted into production JavaScript'; exit 1;
          fi
          echo 'UC03_C2_WEB_BUNDLE=PASS'
          echo 'VERIGENCE_LOGO_BUNDLE=PASS'

      - name: Deploy to Cloudflare DEV
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test deployed C2 Web and Security proxy
        env:
          DEV_WEB_URL: https://verigence-web-dev.jbrconsulting-it.workers.dev
        run: |
          set -euo pipefail
          sleep 5

          curl --fail --silent --show-error --location --output /tmp/login.html "$DEV_WEB_URL/login"
          curl --fail --silent --show-error --location --output /tmp/delivery.html \
            "$DEV_WEB_URL/deliveries/00000000-0000-0000-0000-000000000001"
          grep -q '<div id="root"></div>' /tmp/delivery.html || {
            echo 'Deployed C2 Delivery SPA route did not resolve to the application shell'; exit 1;
          }
          echo 'UC03_C2_DELIVERY_ROUTE=PASS'

          asset_path="$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/login.html | head -n 1 | sed -E 's/^src="([^"]+)"$/\1/')"
          [ -n "$asset_path" ] || { echo 'Could not resolve deployed JavaScript asset'; exit 1; }
          curl --fail --silent --show-error --location --output /tmp/app.js "$DEV_WEB_URL$asset_path"
          if ! grep -q 'data:image/png;base64,' /tmp/app.js; then
            echo 'Deployed Cloudflare JavaScript does not contain approved bundled PNG lockup'; exit 1;
          fi
          echo 'VERIGENCE_LOGO_DEPLOYED_BUNDLE=PASS'

          SECURITY_STATUS="$(curl --silent --show-error \
            --dump-header /tmp/security.headers \
            --output /tmp/security.body \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$DEV_WEB_URL/security/v1/auth/login")"
          if ! grep -qi '^x-verigence-proxy: security' /tmp/security.headers; then
            echo 'Request did not pass through the Verigence Security Worker proxy'; exit 1;
          fi
          case "$SECURITY_STATUS" in 400|401|422) ;; *) exit 1 ;; esac

          for origin in 'capacitor://localhost' 'https://localhost'; do
            curl --fail --silent --show-error \
              --dump-header /tmp/cors.headers --output /dev/null --request OPTIONS \
              --header "Origin: $origin" \
              --header 'Access-Control-Request-Method: POST' \
              --header 'Access-Control-Request-Headers: content-type,authorization,x-onboarding-key' \
              "$DEV_WEB_URL/security/v1/auth/login"
            grep -Fqi "access-control-allow-origin: $origin" /tmp/cors.headers || exit 1
          done
          echo 'CAPACITOR_SECURITY_CORS=PASS'
          echo "WEB_DEPLOYED_SHA=$DEPLOY_SHA"
