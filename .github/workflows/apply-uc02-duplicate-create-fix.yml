name: Apply UC02 duplicate create fix

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/uc02-block-duplicate-project-create'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Block fresh create while provisioning is unresolved
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/ProjectAdministrationPage.tsx')
          text = path.read_text()

          old_submit = "  async function submitProject(event: FormEvent) {\n    event.preventDefault();\n    clearFeedback();\n"
          new_submit = "  async function submitProject(event: FormEvent) {\n    event.preventDefault();\n    if (!project && (provisioning?.provisioningStatus === 'IN_PROGRESS' || provisioning?.provisioningStatus === 'RECOVERY_REQUIRED')) return;\n    clearFeedback();\n"
          if old_submit not in text:
              raise SystemExit('submitProject marker missing')
          text = text.replace(old_submit, new_submit, 1)

          old_state = "  const projectConfigured = Boolean(tenantId && project);\n  const provisioningFailed = provisioning?.provisioningStatus === 'RECOVERY_REQUIRED';\n"
          new_state = "  const projectConfigured = Boolean(tenantId && project);\n  const provisioningFailed = provisioning?.provisioningStatus === 'RECOVERY_REQUIRED';\n  const provisioningUnresolved = provisioning?.provisioningStatus === 'IN_PROGRESS' || provisioning?.provisioningStatus === 'RECOVERY_REQUIRED';\n"
          if old_state not in text:
              raise SystemExit('provisioning state marker missing')
          text = text.replace(old_state, new_state, 1)

          old_button = "<div className=\"uc02-actions\"><button className=\"uc02-button uc02-button--primary\" disabled={busy || projectLoading}>{busy ? 'Saving…' : project ? 'Save Project Details' : 'Create Project'}</button></div>"
          new_button = "<div className=\"uc02-actions\"><button className=\"uc02-button uc02-button--primary\" disabled={busy || projectLoading || (!project && provisioningUnresolved)}>{busy ? 'Saving…' : project ? 'Save Project Details' : provisioningUnresolved ? 'Retry Setup to continue' : 'Create Project'}</button></div>"
          if old_button not in text:
              raise SystemExit('Create Project button marker missing')
          text = text.replace(old_button, new_button, 1)

          path.write_text(text)
          PY
          git rm .github/workflows/apply-uc02-duplicate-create-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ProjectAdministrationPage.tsx
          git commit -m 'fix(uc02): prevent duplicate project create during recovery'
          git push origin HEAD:${{ github.head_ref }}
