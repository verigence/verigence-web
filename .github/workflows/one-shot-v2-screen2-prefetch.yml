name: One-shot V2 Screen 2 prefetch

on:
  push:
    branches:
      - perf/v2-screen2-prefetch
    paths:
      - .github/workflows/one-shot-v2-screen2-prefetch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/v2-screen2-prefetch
          fetch-depth: 0
      - name: Apply V2 submit and upload performance changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service_path = Path('src/services/audit-core/uc03DocumentCaptureV2.ts')
          text = service_path.read_text()
          old = "import { auditCoreRequest } from './client';\n"
          new = "import { auditCoreRequest } from './client';\nimport { newIdempotencyKey } from './uc03Booking';\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = '''interface FinalizeResponse {\n  documentId: string;\n  state: string;\n}\n'''
          new = '''interface FinalizeResponse {\n  documentId: string;\n  state: string;\n}\n\nexport interface BookingCaptureV2Completion {\n  journeyId: string;\n  phase: 'BOOKING';\n  status: 'COMPLETED';\n  aggregateVersion: number;\n}\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''  const byClientId = new Map(prepared.map((item) => [item.clientUploadId, item.file]));\n  const finalized: FinalizeResponse[] = [];\n\n  for (const upload of intent.uploads) {\n    const file = byClientId.get(upload.clientUploadId);\n    if (!file) throw new Error(`Upload intent ${upload.clientUploadId} has no matching local file.`);\n\n    const headers = new Headers(upload.uploadHeaders);\n    if (file.type && !headers.has('Content-Type')) headers.set('Content-Type', file.type);\n    const put = await fetch(upload.uploadUrl, {\n      method: 'PUT',\n      headers,\n      body: file,\n    });\n    if (!put.ok) {\n      throw new Error(`Document storage upload failed with HTTP ${put.status}.`);\n    }\n\n    finalized.push(await auditCoreRequest<FinalizeResponse>(\n      `${base(tenantId, journeyId)}/documents/${encodeURIComponent(upload.documentId)}/finalize`,\n      {\n        method: 'POST',\n        accessToken: token(accessToken),\n      },\n    ));\n  }\n\n  return finalized;\n'''
          new = '''  const byClientId = new Map(prepared.map((item) => [item.clientUploadId, item.file]));\n  const finalized = new Array<FinalizeResponse>(intent.uploads.length);\n  let nextIndex = 0;\n\n  const uploadWorker = async () => {\n    while (true) {\n      const index = nextIndex;\n      nextIndex += 1;\n      if (index >= intent.uploads.length) return;\n\n      const upload = intent.uploads[index];\n      const file = byClientId.get(upload.clientUploadId);\n      if (!file) throw new Error(`Upload intent ${upload.clientUploadId} has no matching local file.`);\n\n      const headers = new Headers(upload.uploadHeaders);\n      if (file.type && !headers.has('Content-Type')) headers.set('Content-Type', file.type);\n      const put = await fetch(upload.uploadUrl, {\n        method: 'PUT',\n        headers,\n        body: file,\n      });\n      if (!put.ok) {\n        throw new Error(`Document storage upload failed with HTTP ${put.status}.`);\n      }\n\n      finalized[index] = await auditCoreRequest<FinalizeResponse>(\n        `${base(tenantId, journeyId)}/documents/${encodeURIComponent(upload.documentId)}/finalize`,\n        {\n          method: 'POST',\n          accessToken: token(accessToken),\n        },\n      );\n    }\n  };\n\n  const concurrency = Math.min(6, intent.uploads.length);\n  await Promise.all(Array.from({ length: concurrency }, () => uploadWorker()));\n  return finalized;\n'''
          assert old in text
          text = text.replace(old, new, 1)

          append = '''\n\nexport async function completeBookingCaptureV2(\n  tenantId: string,\n  journeyId: string,\n  aggregateVersion: number,\n  accessToken?: string,\n): Promise<BookingCaptureV2Completion> {\n  return auditCoreRequest<BookingCaptureV2Completion>(`${base(tenantId, journeyId)}/complete`, {\n    method: 'POST',\n    accessToken: token(accessToken),\n    headers: {\n      'Idempotency-Key': newIdempotencyKey('uc03-v2-booking-complete'),\n      'If-Match': `"${aggregateVersion}"`,\n    },\n  });\n}\n'''
          assert 'export async function completeBookingCaptureV2(' not in text
          text = text.rstrip() + append
          service_path.write_text(text)

          details_path = Path('src/pages/BookingDetailsV2Page.tsx')
          text = details_path.read_text()
          old = "import { submitPcBookingCapture } from '../services/audit-core/uc03PcVerification';\nimport { getBookingCaptureV2, type BookingCaptureV2 } from '../services/audit-core/uc03DocumentCaptureV2';\n"
          new = "import {\n  completeBookingCaptureV2,\n  getBookingCaptureV2,\n  type BookingCaptureV2,\n} from '../services/audit-core/uc03DocumentCaptureV2';\n"
          assert old in text
          text = text.replace(old, new, 1)

          start = text.index('  const pcCaptureValues = (): Record<string, unknown> => ({')
          end_marker = '  });\n\n  const submit = async () => {'
          end = text.index(end_marker, start)
          text = text[:start] + '  const submit = async () => {' + text[end + len(end_marker):]

          old = '''      await submitPcBookingCapture(\n        project.tenantId,\n        journeyId,\n        saved.aggregateVersion,\n        pcCaptureValues(),\n        accessToken,\n      );\n'''
          new = '''      await completeBookingCaptureV2(\n        project.tenantId,\n        journeyId,\n        saved.aggregateVersion,\n        accessToken,\n      );\n'''
          assert old in text
          text = text.replace(old, new, 1)
          details_path.write_text(text)
          PY

          git diff --check
          npm ci
          npm run build
          git diff -- src/services/audit-core/uc03DocumentCaptureV2.ts src/pages/BookingDetailsV2Page.tsx
          git config user.name "Verigence-admin"
          git config user.email "jbrconsulting.it@gmail.com"
          git add src/services/audit-core/uc03DocumentCaptureV2.ts src/pages/BookingDetailsV2Page.tsx
          git commit -m "perf(v2): parallelize uploads and use V2 completion"
          git push origin HEAD:perf/v2-screen2-prefetch
