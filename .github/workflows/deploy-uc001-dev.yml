name: Deploy Verigence Web to Cloudflare DEV

on:
  push:
    branches:
      - main
      - planning/uc-001-user-onboarding
  workflow_dispatch:

concurrency:
  group: deploy-verigence-web-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy DEV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      deployments: write
    env:
      SECURITY_UPSTREAM: https://security-dev.up.railway.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify deployment
        run: |
          echo "Deploying Git commit: $GITHUB_SHA"
          echo "Security DEV upstream: $SECURITY_UPSTREAM"
          echo "WEB_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Security DEV upstream
        run: |
          set -euo pipefail
          echo "Checking $SECURITY_UPSTREAM/health/live"
          curl --fail --silent --show-error \
            --header 'Accept: application/json' \
            "$SECURITY_UPSTREAM/health/live"
          echo

      - name: Typecheck and build
        run: |
          set -euo pipefail
          npm run build
          echo "WEB_BUILD=PASS" >> "$GITHUB_ENV"
        env:
          VITE_SECURITY_BASE_URL: ""
          VITE_AUDIT_CORE_BASE_URL: ${{ secrets.AUDIT_CORE_URL }}

      - name: Verify approved logo build output
        run: |
          LOGO_FILE="$(find dist/assets -maxdepth 1 -type f -name 'verigence-lockup-*.png' -print -quit)"
          if [ -z "$LOGO_FILE" ]; then
            echo "Approved Verigence lockup was not emitted into dist/assets"
            find dist -maxdepth 2 -type f -print
            exit 1
          fi
          test -s "$LOGO_FILE"
          file "$LOGO_FILE"
          sha256sum "$LOGO_FILE"
          echo "VERIGENCE_LOGO_PATH=/${LOGO_FILE#dist/}" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare DEV
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test deployed Web and Security proxy
        env:
          DEV_WEB_URL: https://verigence-web-dev.jbrconsulting-it.workers.dev
        run: |
          set -euo pipefail
          sleep 5

          for page in login forgot-password terms privacy signup; do
            echo "--- Public page: /$page ---"
            curl --fail --silent --show-error --location \
              --output "/tmp/${page}.html" \
              "$DEV_WEB_URL/$page"
            test -s "/tmp/${page}.html"
          done
          echo "WEB_PUBLIC_ROUTES=PASS" >> "$GITHUB_ENV"

          echo "--- Approved logo asset ---"
          curl --fail --silent --show-error \
            --dump-header /tmp/logo.headers \
            --output /tmp/logo.png \
            "$DEV_WEB_URL$VERIGENCE_LOGO_PATH"
          test -s /tmp/logo.png
          file /tmp/logo.png
          if ! grep -qi '^content-type: image/png' /tmp/logo.headers; then
            echo "Deployed logo did not return image/png"
            exit 1
          fi

          echo "--- Security login route via Worker ---"
          SECURITY_STATUS="$(curl --silent --show-error \
            --dump-header /tmp/security.headers \
            --output /tmp/security.body \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$DEV_WEB_URL/security/v1/auth/login")"
          if ! grep -qi '^x-verigence-proxy: security' /tmp/security.headers; then
            echo "Request did not pass through the Verigence Security Worker proxy"
            exit 1
          fi
          case "$SECURITY_STATUS" in
            400|401|422) ;;
            *) echo "Security login route is not healthy through the Worker proxy"; exit 1 ;;
          esac

          echo "--- Password recovery route via Worker ---"
          RESET_READY=false
          for attempt in $(seq 1 30); do
            RESET_STATUS="$(curl --silent --show-error \
              --dump-header /tmp/reset.headers \
              --output /tmp/reset.body \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{}' \
              "$DEV_WEB_URL/security/v1/auth/password-reset")"
            if grep -qi '^x-verigence-proxy: security' /tmp/reset.headers && [ "$RESET_STATUS" = "422" ]; then
              RESET_READY=true
              break
            fi
            echo "Password recovery route not ready yet (HTTP $RESET_STATUS), retrying..."
            sleep 5
          done
          [ "$RESET_READY" = true ] || {
            echo "Password recovery route did not become available through the Worker proxy"
            cat /tmp/reset.headers || true
            cat /tmp/reset.body || true
            exit 1
          }
          echo "PASSWORD_RECOVERY_PROXY=PASS" >> "$GITHUB_ENV"
          echo "WEB_SMOKE=PASS" >> "$GITHUB_ENV"

      - name: Record UC-001 deploy proof
        if: always()
        run: |
          set -euo pipefail
          mkdir -p docs/handoff
          cat > docs/handoff/UC001_PASSWORD_RECOVERY_LEGAL_DEPLOY_PROOF.md <<EOF
          # UC-001 Password Recovery + Interim Legal Pages — DEV Deploy Proof

          - run_id: $GITHUB_RUN_ID
          - source_sha: ${WEB_SOURCE_SHA:-unknown}
          - build: ${WEB_BUILD:-not_reached}
          - public_routes: ${WEB_PUBLIC_ROUTES:-not_reached}
          - password_recovery_proxy: ${PASSWORD_RECOVERY_PROXY:-not_reached}
          - smoke: ${WEB_SMOKE:-not_reached}
          - job_status: ${{ job.status }}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/handoff/UC001_PASSWORD_RECOVERY_LEGAL_DEPLOY_PROOF.md
          git commit -m 'docs(uc-001): record recovery/legal DEV deploy proof [skip ci]' || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
