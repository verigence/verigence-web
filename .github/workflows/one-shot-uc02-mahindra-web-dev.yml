name: One-shot UC02 Mahindra Web DEV

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/one-shot-uc02-mahindra-web-dev.yml

permissions:
  contents: write
  deployments: write

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEV_WEB_URL: https://verigence-web-dev.jbrconsulting-it.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build current dev
        run: npm run build
        env:
          VITE_SECURITY_BASE_URL: ""
          VITE_AUDIT_CORE_BASE_URL: ${{ secrets.AUDIT_CORE_URL }}
          VITE_AUDIT_CORE_PROXY_BASE_URL: /audit-core
      - name: Verify Mahindra UI is in built bundle
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q 'Passenger Vehicle' dist/assets
          grep -R -q 'Battery Electric' dist/assets
          grep -R -q 'Vehicle & Price Master' dist/assets
          grep -R -q 'Discount & Policy Master' dist/assets
          echo 'UC02_MAHINDRA_LOCAL_BUNDLE=PASS'
      - name: Deploy current dev to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify deployed Mahindra UI bundle
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error --location --output /tmp/page.html "$DEV_WEB_URL/login"
          asset_path="$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/page.html | head -n 1 | sed -E 's/^src="([^"]+)"$/\1/')"
          [ -n "$asset_path" ]
          curl --fail --silent --show-error --location --output /tmp/app.js "$DEV_WEB_URL$asset_path"
          grep -q 'Passenger Vehicle' /tmp/app.js
          grep -q 'Battery Electric' /tmp/app.js
          grep -q 'Vehicle & Price Master' /tmp/app.js
          grep -q 'Discount & Policy Master' /tmp/app.js
          echo 'UC02_MAHINDRA_DEPLOYED_BUNDLE=PASS'
      - name: Record success and self-clean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/deployments
          cat > docs/deployments/UC02_MAHINDRA_WEB_DEV_LATEST.md <<EOF
          # UC02 Mahindra Web DEV

          - result: PASS
          - deployed_source_sha: $GITHUB_SHA
          - run_id: $GITHUB_RUN_ID
          - verified_markers: Passenger Vehicle, Battery Electric, Vehicle & Price Master, Discount & Policy Master
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-uc02-mahindra-web-dev.yml
          git add docs/deployments/UC02_MAHINDRA_WEB_DEV_LATEST.md
          git commit -m 'docs(dev): record UC02 Mahindra Web deployment [skip ci]'
          git pull --rebase origin dev
          git push origin HEAD:dev
