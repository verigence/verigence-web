name: One-shot Verify UC02 Mahindra Web Live

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/one-shot-verify-uc02-mahindra-web-live.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEV_WEB_URL: https://verigence-web-dev.jbrconsulting-it.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Verify live Project Administration chunk
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output /tmp/page.html "$DEV_WEB_URL/login"
          entry_path="$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/page.html | head -n 1 | sed -E 's/^src="([^"]+)"$/\1/')"
          [ -n "$entry_path" ]
          curl --fail --silent --show-error --location --output /tmp/entry.js "$DEV_WEB_URL$entry_path"
          project_chunk="$(grep -oE 'ProjectAdministrationPage-[A-Za-z0-9_-]+\.js' /tmp/entry.js | head -n 1)"
          [ -n "$project_chunk" ] || project_chunk='ProjectAdministrationPage-CJ2WNkU0.js'
          curl --fail --silent --show-error --location --output /tmp/project.js "$DEV_WEB_URL/assets/$project_chunk"
          grep -q 'Mahindra Masters' /tmp/project.js
          grep -q 'Discount & Policy Master' /tmp/project.js
          grep -q 'Booking, commercial and trade-in rule parameters' /tmp/project.js
          grep -q 'No Segment choices are configured for this OEM' /tmp/project.js
          echo "$project_chunk" > /tmp/project_chunk.txt
          echo 'UC02_MAHINDRA_LIVE_PROJECT_CHUNK=PASS'
      - name: Preserve verified chunk
        uses: actions/upload-artifact@v4
        with:
          name: uc02-mahindra-live-verification
          path: /tmp/project_chunk.txt
          retention-days: 7

  evidence:
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Record result and self-clean
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/deployments
          cat > docs/deployments/UC02_MAHINDRA_WEB_LIVE_VERIFICATION.md <<EOF
          # UC02 Mahindra Web Live Verification

          - result: $VERIFY_RESULT
          - source_sha: $GITHUB_SHA
          - run_id: $GITHUB_RUN_ID
          - target: Project Administration code-split chunk on Cloudflare DEV
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-verify-uc02-mahindra-web-live.yml
          git add docs/deployments/UC02_MAHINDRA_WEB_LIVE_VERIFICATION.md
          git commit -m 'docs(dev): record live Mahindra Web verification [skip ci]'
          git pull --rebase origin dev
          git push origin HEAD:dev
