name: One-shot R2 V2 upload CORS fix

on:
  push:
    branches:
      - diagnose/r2-v2-upload-cors
    paths:
      - .github/workflows/one-shot-r2-v2-upload-cors-diagnose.yml

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: verigence-di-bucket-dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnose/r2-v2-upload-cors

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install repository dependencies
        run: npm install --no-audit --no-fund

      - name: Write narrow DEV R2 CORS policy
        shell: bash
        run: |
          cat > /tmp/r2-cors.json <<'JSON'
          {
            "rules": [
              {
                "allowed": {
                  "origins": [
                    "https://verigence-web-dev.jbrconsulting-it.workers.dev",
                    "https://localhost"
                  ],
                  "methods": ["GET", "HEAD", "PUT"],
                  "headers": ["Range", "Content-Type"]
                },
                "exposeHeaders": [
                  "Content-Type",
                  "Content-Length",
                  "ETag",
                  "Accept-Ranges",
                  "Content-Range"
                ],
                "maxAgeSeconds": 3600
              }
            ]
          }
          JSON
          cat /tmp/r2-cors.json

      - name: Apply private R2 CORS policy
        run: npx wrangler r2 bucket cors set "$R2_BUCKET" --file /tmp/r2-cors.json --force

      - name: Verify live R2 CORS policy
        run: npx wrangler r2 bucket cors list "$R2_BUCKET"
