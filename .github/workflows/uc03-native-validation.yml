name: UC03 Android Validation

# Shared UC03 native evidence gate; current artifact identifies the C2 Delivery checkpoint.
on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/uc03-native-validation.yml'
      - '.env.native-dev'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'scripts/configure-native.mjs'
      - 'scripts/finalize-native-branding.mjs'
      - 'scripts/stabilize-native-branding.mjs'
      - 'src/**'
  # PR runs build + sign + verify (see the release-signing step's own
  # secrets, available to same-repo PRs) but never publish -- only a push
  # to dev (a merge) hands out a new "latest" download, so an in-review
  # PR's build can never overwrite what the App Portal is serving.
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: uc03-android-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android packages
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_SECURITY_BASE_URL: https://verigence-web-dev.jbrconsulting-it.workers.dev
      VITE_AUDIT_CORE_BASE_URL: ${{ secrets.AUDIT_CORE_URL }}

    steps:
      - name: Checkout UC03 branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Android Web assets
        run: npm run build:native:dev

      - name: Generate and sync Android
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android
          npx cap ls android
          node scripts/configure-native.mjs android
          # Re-apply the already-approved Android branding finalizer. Capacitor
          # generates a drawable-v24 launcher foreground that overrides the base
          # drawable on modern devices unless this step replaces it.
          node scripts/finalize-native-branding.mjs android

      - name: Stabilize Android Verigence branding
        run: |
          set -euo pipefail
          node scripts/stabilize-native-branding.mjs
          test -s android/app/src/main/res/drawable/verigence_splash_mark.xml
          test ! -e android/app/src/main/res/drawable/verigence_splash_mark.png
          test ! -e android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          grep -q '#0A63C7' android/app/src/main/res/drawable/ic_launcher_foreground.xml
          grep -q '#00AFA8' android/app/src/main/res/drawable/ic_launcher_foreground.xml
          grep -q 'M64,136' android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml
          grep -q '#00CBB0' android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml
          if grep -q 'M66.94,46.02\|M32,64' android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml; then
            echo '::error::Stock Android launcher artwork remains in drawable-v24.'
            exit 1
          fi
          grep -q '#0A63C7' android/app/src/main/res/drawable/verigence_splash_mark.xml
          grep -q '#00AFA8' android/app/src/main/res/drawable/verigence_splash_mark.xml
          echo 'ANDROID_VERIGENCE_BRANDING=PASS'
          echo 'ANDROID_API24_VERIGENCE_LAUNCHER=PASS'

      - name: Verify Android native configuration
        run: |
          set -euo pipefail
          manifest='android/app/src/main/AndroidManifest.xml'
          grep -q 'android.permission.CAMERA' "$manifest"
          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$manifest"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          grep -q 'com.verigence.app' android/app/build.gradle || grep -R -q 'com.verigence.app' android/app
          grep -R -q 'capacitor-app' android || grep -R -q 'AppPlugin' android
          grep -R -q 'capacitor-camera' android || grep -R -q 'CameraPlugin' android
          grep -R -q 'capacitor-status-bar' android || grep -R -q 'StatusBarPlugin' android
          grep -R -q 'capacitor-keyboard' android || grep -R -q 'KeyboardPlugin' android
          # Regression guard: android:background (a no-op on a window theme)
          # instead of android:windowBackground silently drops the splash
          # drawable on every API <31 device -- opaque white, no Verigence
          # mark. See scripts/configure-native.mjs's own comment for the
          # full story.
          grep -q 'name="android:windowBackground">@drawable/splash' android/app/src/main/res/values/styles.xml
          if grep -q 'name="android:background">@drawable/splash' android/app/src/main/res/values/styles.xml; then
            echo '::error::Launch theme windowBackground regression: android:background instead of android:windowBackground.'
            exit 1
          fi
          grep -q 'SplashScreen.installSplashScreen(this)' android/app/src/main/java/com/verigence/app/MainActivity.java
          echo 'ANDROID_NATIVE_CONFIG=PASS'
          echo 'ANDROID_SPLASH_WINDOW_BACKGROUND=PASS'

      - name: Verify mobile Take Photo unified-flow contract
        run: |
          set -euo pipefail
          host='src/features/mobile-capture/MobileDocumentCaptureHost.tsx'
          grep -q 'captureContextForInput' "$host"
          grep -q 'uc03-booking-v2-hero' "$host"
          grep -q 'uc03-delivery-v2-hero' "$host"
          grep -q 'new DataTransfer' "$host"
          grep -q "dispatchEvent(new Event('change'" "$host"
          if grep -q 'uploadUnifiedCaptureFiles' "$host"; then
            echo 'Mobile capture must not own upload lifecycle' >&2
            exit 1
          fi
          if grep -q 'waitForJourneyId' "$host"; then
            echo 'Mobile capture must not wait for or create Journey readiness' >&2
            exit 1
          fi
          echo 'MOBILE_TAKE_PHOTO_UNIFIED_FLOW=PASS'

      - name: Verify C2 Delivery camera contract in Web source
        run: |
          set -euo pipefail
          grep -q 'capture=' src/pages/DeliveryWorkspacePage.tsx
          grep -q "requirementKey === 'CAR_PICTURES'" src/pages/DeliveryWorkspacePage.tsx
          grep -q '/delivery/workspace' src/services/audit-core/uc03Delivery.ts
          echo 'UC03_C2_ANDROID_DELIVERY_CONTRACT=PASS'

      - name: Configure Android release signing
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          keystore_path="$GITHUB_WORKSPACE/android/app/release-signing.keystore"
          echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"

          # No key-alias secret exists -- a release signing keystore has
          # exactly one purpose-built entry, so read the alias directly out
          # of the keystore itself instead of depending on someone also
          # having typed it correctly into a fourth secret.
          alias_count="$(keytool -list -v -keystore "$keystore_path" -storepass "$ANDROID_RELEASE_STORE_PASSWORD" 2>/dev/null | grep -c 'Alias name:')"
          if [ "$alias_count" -ne 1 ]; then
            echo "::error::Expected exactly one alias in the release keystore, found $alias_count."
            exit 1
          fi
          key_alias="$(keytool -list -v -keystore "$keystore_path" -storepass "$ANDROID_RELEASE_STORE_PASSWORD" 2>/dev/null | grep 'Alias name:' | sed 's/Alias name: //')"

          echo "ANDROID_RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_ALIAS=$key_alias" >> "$GITHUB_ENV"

          node scripts/configure-android-signing.mjs android
          grep -q 'ANDROID_RELEASE_KEYSTORE_PATH' android/app/build.gradle
          echo 'ANDROID_RELEASE_SIGNING_CONFIGURED=PASS'

      - name: Lint and build Android debug and release APKs
        working-directory: android
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew lintDebug assembleDebug assembleRelease --stacktrace

      - name: Verify APKs
        run: |
          set -euo pipefail
          debug_apk='android/app/build/outputs/apk/debug/app-debug.apk'
          release_apk='android/app/build/outputs/apk/release/app-release.apk'
          test -s "$debug_apk"
          test -s "$release_apk"

          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)"
          if [ -z "$apksigner_bin" ]; then
            echo "::error::apksigner not found under ANDROID_HOME/build-tools"
            exit 1
          fi
          "$apksigner_bin" verify --print-certs "$release_apk"
          echo 'ANDROID_RELEASE_APK_SIGNED=PASS'

          verify_launcher_payload() {
            apk="$1"
            tmpdir="$(mktemp -d)"
            unzip -q "$apk" 'res/*.xml' -d "$tmpdir"
            brand_count="$( (grep -Rla 'M64,136' "$tmpdir/res" || true) | wc -l | tr -d ' ')"
            stock_count="$( (grep -Rla -E 'M66\.94,46\.02|M32,64' "$tmpdir/res" || true) | wc -l | tr -d ' ')"
            rm -rf "$tmpdir"
            if [ "$brand_count" -lt 1 ]; then
              echo "::error::Built APK contains no Verigence launcher vector payload: $apk"
              exit 1
            fi
            if [ "$stock_count" -ne 0 ]; then
              echo "::error::Built APK still contains stock Android launcher artwork: $apk"
              exit 1
            fi
            echo "APK_VERIGENCE_VECTOR_COUNT=$brand_count"
          }

          unzip -t "$debug_apk" >/dev/null
          unzip -t "$release_apk" >/dev/null
          verify_launcher_payload "$debug_apk"
          verify_launcher_payload "$release_apk"

          sha256sum "$debug_apk" | tee android-debug-apk.sha256
          sha256sum "$release_apk" | tee android-release-apk.sha256
          ls -lh "$debug_apk" "$release_apk"
          echo 'ANDROID_APK_VERIGENCE_ICON=PASS'

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: verigence-uc03-c2-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-debug-apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: verigence-android-release-signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android-release-apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android release to the App Portal
        # Only after a real merge (see the workflow's own push trigger) --
        # never on a PR run, so an in-review branch's build can't become
        # what /app-distribution/latest hands out.
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          release_apk='android/app/build/outputs/apk/release/app-release.apk'
          bucket='verigence-app-releases'
          build_id="${GITHUB_SHA:0:7}"
          object_key="android/verigence-${build_id}.apk"
          version_name="$(grep -oE 'versionName "[^"]+"' android/app/build.gradle | head -1 | sed -E 's/versionName "([^"]+)"/\1/')"
          size_bytes="$(stat -c%s "$release_apk")"
          size_human="$(numfmt --to=iec --suffix=B "$size_bytes")"
          sha256_hex="$(sha256sum "$release_apk" | cut -d' ' -f1)"
          released_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          npx wrangler r2 object put "$bucket/$object_key" \
            --file "$release_apk" \
            --content-type application/vnd.android.package-archive \
            --remote

          metadata_file="$(mktemp)"
          jq -n \
            --arg objectKey "$object_key" \
            --arg version "$version_name" \
            --arg build "$build_id" \
            --arg size "$size_human" \
            --argjson sizeBytes "$size_bytes" \
            --arg sha256 "$sha256_hex" \
            --arg releasedAt "$released_at" \
            '{objectKey: $objectKey, version: $version, build: $build, size: $size, sizeBytes: $sizeBytes, sha256: $sha256, releasedAt: $releasedAt}' \
            > "$metadata_file"
          npx wrangler r2 object put "$bucket/android/latest.json" \
            --file "$metadata_file" \
            --content-type application/json \
            --remote
          echo "ANDROID_RELEASE_PUBLISHED=$object_key"
