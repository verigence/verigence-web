name: UC03 Android Validation

# Shared UC03 native evidence gate; current artifact identifies the C2 Delivery checkpoint.
on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/uc03-native-validation.yml'
      - '.env.native-dev'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'scripts/configure-native.mjs'
      - 'src/**'

permissions:
  contents: read

concurrency:
  group: uc03-android-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android packages
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_SECURITY_BASE_URL: https://verigence-web-dev.jbrconsulting-it.workers.dev
      VITE_AUDIT_CORE_BASE_URL: ${{ secrets.AUDIT_CORE_URL }}

    steps:
      - name: Checkout UC03 branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Android Web assets
        run: npm run build:native:dev

      - name: Generate and sync Android
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android
          npx cap ls android
          node scripts/configure-native.mjs android

      - name: Stabilize Android splash resource for release packaging
        run: |
          set -euo pipefail
          rm -f android/app/src/main/res/drawable/verigence_splash_mark.png
          cp android/app/src/main/res/drawable/ic_launcher_foreground.xml \
            android/app/src/main/res/drawable/verigence_splash_mark.xml
          test -s android/app/src/main/res/drawable/verigence_splash_mark.xml

      - name: Verify Android native configuration
        run: |
          set -euo pipefail
          manifest='android/app/src/main/AndroidManifest.xml'
          grep -q 'android.permission.CAMERA' "$manifest"
          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$manifest"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          grep -q 'com.verigence.app' android/app/build.gradle || grep -R -q 'com.verigence.app' android/app
          grep -R -q 'capacitor-app' android || grep -R -q 'AppPlugin' android
          grep -R -q 'capacitor-camera' android || grep -R -q 'CameraPlugin' android
          grep -R -q 'capacitor-status-bar' android || grep -R -q 'StatusBarPlugin' android
          grep -R -q 'capacitor-keyboard' android || grep -R -q 'KeyboardPlugin' android
          echo 'ANDROID_NATIVE_CONFIG=PASS'

      - name: Verify mobile Take Photo unified-flow contract
        run: |
          set -euo pipefail
          host='src/features/mobile-capture/MobileDocumentCaptureHost.tsx'
          grep -q 'captureContextForInput' "$host"
          grep -q 'uc03-booking-v2-hero' "$host"
          grep -q 'uc03-delivery-v2-hero' "$host"
          grep -q 'new DataTransfer' "$host"
          grep -q "dispatchEvent(new Event('change'" "$host"
          if grep -q 'uploadUnifiedCaptureFiles' "$host"; then
            echo 'Mobile capture must not own upload lifecycle' >&2
            exit 1
          fi
          if grep -q 'waitForJourneyId' "$host"; then
            echo 'Mobile capture must not wait for or create Journey readiness' >&2
            exit 1
          fi
          echo 'MOBILE_TAKE_PHOTO_UNIFIED_FLOW=PASS'

      - name: Verify C2 Delivery camera contract in Web source
        run: |
          set -euo pipefail
          grep -q 'capture=' src/pages/DeliveryWorkspacePage.tsx
          grep -q "requirementKey === 'CAR_PICTURES'" src/pages/DeliveryWorkspacePage.tsx
          grep -q '/delivery/workspace' src/services/audit-core/uc03Delivery.ts
          echo 'UC03_C2_ANDROID_DELIVERY_CONTRACT=PASS'

      - name: Lint and build Android debug and release APKs
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew lintDebug assembleDebug assembleRelease --stacktrace

      - name: Generate persistent release signing key
        run: |
          set -euo pipefail
          umask 077
          password="$(openssl rand -base64 32 | tr -d '\n' | tr '/+' 'AZ' | cut -c1-32)"
          printf '%s' "$password" > verigence-release-key-password.txt
          keytool -genkeypair \
            -keystore verigence-release.jks \
            -storepass "$password" \
            -keypass "$password" \
            -alias verigence-release \
            -keyalg RSA \
            -keysize 4096 \
            -sigalg SHA256withRSA \
            -validity 9125 \
            -dname 'CN=Verigence, OU=Mobile, O=JBRConsulting, L=Kolkatta, ST=West Bengal, C=IN'
          test -s verigence-release.jks
          test -s verigence-release-key-password.txt

      - name: Align, sign and verify Android release APK
        run: |
          set -euo pipefail
          unsigned_apk='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          aligned_apk='android/app/build/outputs/apk/release/app-release-aligned.apk'
          signed_apk='android/app/build/outputs/apk/release/Verigence-dev-release-signed.apk'
          test -s "$unsigned_apk"

          ZIPALIGN="$(find "${ANDROID_HOME}/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          "$ZIPALIGN" -f -p 4 "$unsigned_apk" "$aligned_apk"
          password="$(cat verigence-release-key-password.txt)"
          "$APKSIGNER" sign \
            --ks verigence-release.jks \
            --ks-key-alias verigence-release \
            --ks-pass "pass:$password" \
            --key-pass "pass:$password" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$signed_apk" \
            "$aligned_apk"

          "$APKSIGNER" verify --verbose --print-certs "$signed_apk" | tee android-release-signature-verification.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' android-release-signature-verification.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' android-release-signature-verification.txt
          sha256sum "$signed_apk" | tee android-release-signed-apk.sha256
          test -s "$signed_apk"

      - name: Verify debug APK
        run: |
          set -euo pipefail
          debug_apk='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$debug_apk"
          sha256sum "$debug_apk" | tee android-debug-apk.sha256

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: verigence-uc03-c2-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-debug-apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified signed release package
        uses: actions/upload-artifact@v4
        with:
          name: verigence-android-release-signed
          path: |
            android/app/build/outputs/apk/release/Verigence-dev-release-signed.apk
            android-release-signed-apk.sha256
            android-release-signature-verification.txt
            verigence-release.jks
            verigence-release-key-password.txt
          if-no-files-found: error
          retention-days: 14
