name: One-time UC03 UI contract cleanup

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/uc03-ui-contract-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply impact-assessed UI cleanup only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_all(path, old, new):
              p = Path(path)
              source = p.read_text()
              count = source.count(old)
              if count:
                  p.write_text(source.replace(old, new))
                  print(f'UPDATED {path}: {count} occurrence(s)')
              else:
                  print(f'NOOP {path}: expected text already absent')

          # Operational display references only. Do not touch UC02 administration,
          # provisioning, Project selection, or backend create/delete contracts.
          for path in [
              'src/pages/BookingCaptureV2Page.tsx',
              'src/pages/BookingReviewPage.tsx',
              'src/pages/BookingWorkspacePage.tsx',
          ]:
              replace_all(path, '<span>Project · {project.projectName}</span>', '')

          replace_all(
              'src/pages/DeliveryCaptureV2Page.tsx',
              '<span>{project.projectName}</span>',
              '',
          )

          replace_all(
              'src/pages/DocumentIntelligenceConfigurationPage.tsx',
              '{project.projectName} · {project.projectCode}',
              '{project.projectCode}',
          )

          p = Path('src/pages/TeamLeadDashboardPage.tsx')
          source = p.read_text()
          source = source.replace(
              '`${project.projectName} · All dealers · All outlets`',
              '`All dealers · All outlets`',
          )
          source = source.replace(
              "`${project.projectName} · ${dealerCount} dealer${dealerCount === 1 ? '' : 's'} · ${outletCount} outlet${outletCount === 1 ? '' : 's'}`",
              "`${dealerCount} dealer${dealerCount === 1 ? '' : 's'} · ${outletCount} outlet${outletCount === 1 ? '' : 's'}`",
          )
          p.write_text(source)
          print('UPDATED src/pages/TeamLeadDashboardPage.tsx')

          # Existing build governance also requires reliable field localization before
          # opening source evidence. This is a view-safety gate only.
          p = Path('src/pages/AuditReviewPage.tsx')
          source = p.read_text()
          source = source.replace(
              "import AttributeEvidenceViewer from '../features/uc03/AttributeEvidenceViewer';",
              "import AttributeEvidenceViewer, { hasBoxedEvidence } from '../features/uc03/AttributeEvidenceViewer';",
          )
          source = source.replace(
              '<AuditSourceComparisonTable comparison={sourceComparisonQuery.data} onEvidence={setSelectedSource} />',
              '<AuditSourceComparisonTable comparison={sourceComparisonQuery.data} onEvidence={(source) => { if (hasBoxedEvidence(source)) setSelectedSource(source); }} />',
          )
          source = source.replace(
              '{selectedSource && (\n        <AttributeEvidenceViewer',
              '{selectedSource && hasBoxedEvidence(selectedSource) && (\n        <AttributeEvidenceViewer',
          )
          p.write_text(source)
          print('UPDATED src/pages/AuditReviewPage.tsx')

          operational = [
              'src/pages/BookingCaptureV2Page.tsx',
              'src/pages/BookingReviewPage.tsx',
              'src/pages/BookingWorkspacePage.tsx',
              'src/pages/DeliveryCaptureV2Page.tsx',
              'src/pages/DocumentIntelligenceConfigurationPage.tsx',
              'src/pages/TeamLeadDashboardPage.tsx',
          ]
          leftovers = []
          for path in operational:
              text = Path(path).read_text()
              if '.projectName' in text:
                  leftovers.append(path)
          if leftovers:
              raise SystemExit('Operational Project Name references remain: ' + ', '.join(leftovers))

          audit_review = Path('src/pages/AuditReviewPage.tsx').read_text()
          if 'hasBoxedEvidence' not in audit_review:
              raise SystemExit('AuditReviewPage.tsx: boxed-evidence gate missing')

          print('IMPACT_ASSESSED_UI_CLEANUP=PASS')
          PY

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/uc03-ui-contract-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --check
          git commit -m "UC03 UI: remove operational Project Name safely"
          git push origin HEAD:dev
