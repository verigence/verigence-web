name: Deploy Verigence Web to Cloudflare DEV

on:
  push:
    branches:
      - main
      - planning/uc-001-user-onboarding
  workflow_dispatch:

concurrency:
  group: deploy-verigence-web-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy DEV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      # Public DEV service endpoint; this is configuration, not a credential.
      SECURITY_UPSTREAM: https://security-dev.up.railway.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identify deployment
        run: |
          echo "Deploying Git commit: $GITHUB_SHA"
          echo "Security DEV upstream: $SECURITY_UPSTREAM"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Security DEV upstream
        run: |
          set -euo pipefail
          echo "Checking $SECURITY_UPSTREAM/health/live"
          curl --fail --silent --show-error \
            --header 'Accept: application/json' \
            "$SECURITY_UPSTREAM/health/live"
          echo

      - name: Typecheck and build
        run: npm run build
        env:
          # Browser calls /security/* on the Web origin. The Worker proxies it to Security DEV.
          VITE_SECURITY_BASE_URL: ""
          VITE_AUDIT_CORE_BASE_URL: ${{ secrets.AUDIT_CORE_URL }}

      - name: Verify approved logo build output
        run: |
          LOGO_FILE="$(find dist/assets -maxdepth 1 -type f -name 'verigence-lockup-*.png' -print -quit)"
          if [ -z "$LOGO_FILE" ]; then
            echo "Approved Verigence lockup was not emitted into dist/assets"
            find dist -maxdepth 2 -type f -print
            exit 1
          fi
          test -s "$LOGO_FILE"
          file "$LOGO_FILE"
          sha256sum "$LOGO_FILE"
          echo "VERIGENCE_LOGO_PATH=/${LOGO_FILE#dist/}" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare DEV
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy
            --var "SECURITY_UPSTREAM:${{ env.SECURITY_UPSTREAM }}"

      - name: Smoke test deployed Web and Security proxy
        env:
          DEV_WEB_URL: https://verigence-web-dev.jbrconsulting-it.workers.dev
        run: |
          set -euo pipefail
          sleep 5

          echo "--- Login page ---"
          curl --fail --silent --show-error --location \
            --dump-header /tmp/login.headers \
            --output /tmp/login.html \
            "$DEV_WEB_URL/login"
          head -n 20 /tmp/login.headers

          echo "--- Approved logo asset ---"
          curl --fail --silent --show-error \
            --dump-header /tmp/logo.headers \
            --output /tmp/logo.png \
            "$DEV_WEB_URL$VERIGENCE_LOGO_PATH"
          head -n 20 /tmp/logo.headers
          test -s /tmp/logo.png
          file /tmp/logo.png
          if ! grep -qi '^content-type: image/png' /tmp/logo.headers; then
            echo "Deployed logo did not return image/png"
            exit 1
          fi

          echo "--- Security login route via Worker ---"
          SECURITY_STATUS="$(curl --silent --show-error \
            --dump-header /tmp/security.headers \
            --output /tmp/security.body \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$DEV_WEB_URL/security/v1/auth/login")"
          cat /tmp/security.headers
          cat /tmp/security.body
          echo
          echo "Security smoke status: $SECURITY_STATUS"

          if ! grep -qi '^x-verigence-proxy: security' /tmp/security.headers; then
            echo "Request did not pass through the Verigence Security Worker proxy"
            exit 1
          fi

          # Empty login JSON should reach FastAPI and fail request validation, normally HTTP 422.
          # 400/401 are accepted defensively if the Security boundary normalizes validation/auth first.
          case "$SECURITY_STATUS" in
            400|401|422) ;;
            *)
              echo "Security login route is not healthy through the Worker proxy"
              exit 1
              ;;
          esac
