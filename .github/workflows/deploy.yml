name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

# Prevent concurrent deploys
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:  ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL:      /sign-in
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /dashboard
          NEXT_PUBLIC_SECURITY_URL:           ${{ secrets.SECURITY_URL }}
          NEXT_PUBLIC_AUDIT_CORE_URL:         ${{ secrets.AUDIT_CORE_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy .next
            --project-name=verigence-web
            --branch=${{ github.ref_name }}
        env:
          # Server-side secrets injected at runtime via CF Pages env vars
          # Set these in: CF Pages dashboard → Settings → Environment Variables
          # CLERK_SECRET_KEY
          # SECURITY_CLIENT_ID
          # SECURITY_CLIENT_SECRET
