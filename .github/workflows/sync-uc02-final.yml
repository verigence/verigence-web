name: Final Sync UC02 With Dev

on:
  push:
    branches:
      - refactor/uc02-project-admin-workspace

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[uc02-final-dev-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/uc02-project-admin-workspace
          fetch-depth: 0
      - name: Merge latest dev into UC02 refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Verigence-admin'
          git config user.email 'admin@verigence.local'
          git fetch origin dev
          if git merge-base --is-ancestor origin/dev HEAD; then
            echo 'Already current with dev'
            exit 0
          fi
          git merge --no-edit origin/dev
          git commit --amend -m 'merge: sync UC02 refactor with latest dev [uc02-final-dev-sync]'
          git push origin HEAD:refactor/uc02-project-admin-workspace
