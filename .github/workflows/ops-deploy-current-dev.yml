name: Ops Deploy Current Verigence Web DEV

on:
  push:
    branches:
      - dev

concurrency:
  group: ops-deploy-verigence-web-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Current DEV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      SECURITY_UPSTREAM: https://security-dev.up.railway.app
      AUDIT_CORE_UPSTREAM: https://verigence-audit-core-production.up.railway.app
      DI_UPSTREAM: https://di-api-dev.up.railway.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identify deployment
        run: |
          echo "Deploying Git commit: $GITHUB_SHA"
          echo "Deploying branch: $GITHUB_REF_NAME"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate DEV upstreams
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --header 'Accept: application/json' "$SECURITY_UPSTREAM/health/live"
          echo
          curl --fail --silent --show-error --header 'Accept: application/json' "$AUDIT_CORE_UPSTREAM/health"
          echo
          curl --fail --silent --show-error --header 'Accept: application/json' "$DI_UPSTREAM/health/ready"
          echo

      - name: Typecheck and build
        run: npm run build
        env:
          VITE_SECURITY_BASE_URL: ""
          VITE_AUDIT_CORE_BASE_URL: ${{ secrets.AUDIT_CORE_URL }}
          VITE_AUDIT_CORE_PROXY_BASE_URL: /audit-core

      - name: Deploy to Cloudflare DEV
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test deployed Web
        env:
          DEV_WEB_URL: https://verigence-web-dev.jbrconsulting-it.workers.dev
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' --header 'Pragma: no-cache' "$DEV_WEB_URL/login?deploy=$GITHUB_SHA" >/tmp/login.html
          asset_path="$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/login.html | head -n 1 | sed -E 's/^src="([^"]+)"$/\1/')"
          [ -n "$asset_path" ]
          curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "$DEV_WEB_URL$asset_path?deploy=$GITHUB_SHA" >/tmp/app.js
          grep -q 'data:image/png;base64,' /tmp/app.js
          echo "CURRENT_DEV_DEPLOYMENT=PASS sha=$GITHUB_SHA asset=$asset_path"
