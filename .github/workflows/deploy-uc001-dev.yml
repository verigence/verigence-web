name: Deploy UC-001 to Cloudflare DEV

on:
  push:
    branches:
      - planning/uc-001-user-onboarding
  workflow_dispatch:

concurrency:
  group: deploy-verigence-web-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy DEV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build
        env:
          VITE_SECURITY_BASE_URL: ${{ secrets.SECURITY_URL }}
          VITE_AUDIT_CORE_BASE_URL: ${{ secrets.AUDIT_CORE_URL }}

      - name: Deploy to Cloudflare DEV
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
