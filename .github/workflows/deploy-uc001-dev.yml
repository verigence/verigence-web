name: Deploy Verigence Web to Cloudflare DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-verigence-web-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy DEV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      SECURITY_UPSTREAM: https://security-dev.up.railway.app
      AUDIT_CORE_UPSTREAM: https://verigence-audit-core-production.up.railway.app
      DI_UPSTREAM: https://di-api-dev.up.railway.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identify deployment
        run: |
          echo "Deploying Git commit: $GITHUB_SHA"
          echo "Deploying branch: $GITHUB_REF_NAME"
          echo "Security DEV upstream: $SECURITY_UPSTREAM"
          echo "Audit Core DEV upstream: $AUDIT_CORE_UPSTREAM"
          echo "DI DEV upstream: $DI_UPSTREAM"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate DEV upstreams
        run: |
          set -euo pipefail
          # An upstream that is redeploying answers 502 for a minute or two
          # (Audit Core and the web deploy usually land together), so each
          # check waits for it rather than failing the whole deploy.
          check() {
            local label="$1" url="$2" attempt
            echo "Checking $label $url"
            for attempt in $(seq 1 18); do
              if curl --fail --silent --show-error --max-time 20 \
                   --header 'Accept: application/json' "$url"; then
                echo
                return 0
              fi
              echo " (attempt $attempt/18: not healthy yet, retrying in 10s)"
              sleep 10
            done
            echo "::error::$label at $url did not become healthy within 3 minutes"
            return 1
          }
          check "Security DEV" "$SECURITY_UPSTREAM/health/live"
          check "Audit Core DEV" "$AUDIT_CORE_UPSTREAM/health"
          check "DI DEV" "$DI_UPSTREAM/health/ready"

      - name: Verify exact approved Verigence logo source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const files = [1, 2, 3, 4].map((part) => `src/assets/lockup.part${part}.ts`);
          const base64 = files.map((file) => {
            const source = fs.readFileSync(file, 'utf8');
            const match = source.match(/^export default '([^']+)'/);
            if (!match) throw new Error(`Cannot read logo base64 from ${file}`);
            return match[1];
          }).join('');
          const image = Buffer.from(base64, 'base64');
          const sha256 = crypto.createHash('sha256').update(image).digest('hex');
          const expected = '6e2c9a9467367a2f35466a7807672379ab3623e535e29e3914d4be731a837f60';
          if (sha256 !== expected) {
            throw new Error(`Approved logo digest mismatch: ${sha256}`);
          }
          if (image.length !== 36060 || image.subarray(0, 8).toString('hex') !== '89504e470d0a1a0a') {
            throw new Error('Approved logo is not the expected 36,060-byte PNG');
          }
          console.log(`VERIGENCE_LOGO_SOURCE=PASS sha256=${sha256} bytes=${image.length}`);
          NODE

      - name: Typecheck and build
        run: npm run build
        env:
          VITE_SECURITY_BASE_URL: ""
          VITE_AUDIT_CORE_BASE_URL: ${{ secrets.AUDIT_CORE_URL }}
          VITE_AUDIT_CORE_PROXY_BASE_URL: /audit-core

      - name: Verify approved logo is bundled
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -R -q 'data:image/png;base64,' dist/assets; then
            echo "Approved bundled PNG lockup was not emitted into the production JavaScript"
            find dist -maxdepth 2 -type f -print
            exit 1
          fi
          echo "VERIGENCE_LOGO_BUNDLE=PASS"

      - name: Verify Audit Core proxy prefix is bundled
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -R -q '/audit-core' dist/assets; then
            echo 'Audit Core same-origin proxy prefix was not emitted into the production bundle.'
            exit 1
          fi
          echo 'AUDIT_CORE_PROXY_BUNDLE=PASS'

      - name: Verify DI Test Console is bundled
        shell: bash
        run: |
          set -euo pipefail
          di_chunk="$(find dist/assets -maxdepth 1 -type f -name 'DiTestConsolePage-*.js' | head -n 1)"
          [ -n "$di_chunk" ] || {
            echo 'DI Test Console lazy chunk was not emitted by the Web build.'
            exit 1
          }
          grep -q 'DI Test Console' "$di_chunk" || {
            echo 'DI Test Console chunk does not contain the expected console marker.'
            exit 1
          }
          echo "DI_TEST_CONSOLE_BUNDLE=PASS|$(basename "$di_chunk")"

      - name: Deploy to Cloudflare DEV
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Without a lockfile, npm occasionally installs wrangler without
          # the workerd binary for the runner; the action then treats the
          # project's wrangler as broken and falls back to its bundled
          # 3.90.0, which cannot read wrangler.jsonc ("Missing
          # entry-point", 2026-09-28 08:45). Pin the 4.x line the project
          # declares so the action installs a working copy instead.
          wranglerVersion: "4.123.0"
          command: deploy

      - name: One web address; the old address answers only installed apps
        # verigence.jbrconsulting.in is the only web address (and the API address of apps from 1.6.5).
        # The workers.dev address answers only the API routes of apps installed before that; a
        # browser opening it is sent to the new address. The first deploy waits for DNS.
        shell: bash
        run: |
          set +e -u
          NEW=https://verigence.jbrconsulting.in
          OLD=https://verigence-web-dev.jbrconsulting-it.workers.dev
          for attempt in $(seq 1 40); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$NEW/login?deploy=$GITHUB_SHA")"
            [ "$code" = "200" ] && break
            echo "$NEW/login answered '$code' (attempt $attempt/40), retrying in 15s"
            sleep 15
          done
          [ "$code" = "200" ] || { echo "::error::$NEW does not serve the web app"; exit 1; }
          echo "WEB_ADDRESS=PASS|$NEW"

          loc="$(curl --silent --output /dev/null --max-time 20 --write-out '%{http_code} %{redirect_url}' "$OLD/login?x=1")"
          [ "$loc" = "302 $NEW/login?x=1" ] || { echo "::error::$OLD/login should send browsers to $NEW, got: $loc"; exit 1; }
          echo "OLD_ADDRESS_SENDS_BROWSERS_ON=PASS"

          for base in "$NEW" "$OLD"; do
            for route in "security|POST|/security/v1/auth/login" "audit-core|GET|/audit-core/health" "hr|GET|/hr-api/health"; do
              IFS='|' read -r proxy method path <<< "$route"
              if [ "$method" = POST ]; then
                hdr="$(curl --silent --max-time 20 --dump-header - --output /dev/null --request POST \
                  --header 'Content-Type: application/json' --data '{}' "$base$path")"
              else
                hdr="$(curl --silent --max-time 20 --dump-header - --output /dev/null "$base$path")"
              fi
              echo "$hdr" | grep -qi "^x-verigence-proxy: $proxy" || {
                echo "::error::$base$path did not pass through the $proxy proxy"; echo "$hdr"; exit 1; }
            done
            for origin in 'capacitor://localhost' 'https://localhost'; do
              curl --silent --max-time 20 --dump-header - --output /dev/null --request OPTIONS \
                --header "Origin: $origin" --header 'Access-Control-Request-Method: POST' \
                --header 'Access-Control-Request-Headers: content-type,authorization' \
                "$base/security/v1/auth/login" | grep -qi "^access-control-allow-origin: $origin" || {
                echo "::error::$base does not allow the app origin $origin"; exit 1; }
            done
            echo "APP_API_ROUTES=PASS|$base"
          done

          # Some review pages call Document Intelligence straight from the browser.
          if curl --silent --max-time 20 --dump-header - --output /dev/null --request OPTIONS \
               --header "Origin: $NEW" --header 'Access-Control-Request-Method: POST' \
               --header 'Access-Control-Request-Headers: content-type,authorization' \
               "$DI_UPSTREAM/v1/tenants/70c5661e-bab2-46e7-8199-0f9c32acbac3/subjects" \
             | grep -Eqi "^access-control-allow-origin: (\*|$NEW)"; then
            echo "DI_ALLOWS_NEW_ADDRESS=PASS"
          else
            echo "::warning::Document Intelligence does not allow $NEW yet (direct browser calls from review pages)"
          fi

      - name: Document storage accepts direct uploads from every web and app address
        # Web and the Android app send files straight to R2 on a signed link (bulk upload, document
        # upload, replace) and read some back the same way. R2 answers a browser only for the
        # addresses in the bucket's CORS policy. On 2026-11-09 the move to verigence.jbrconsulting.in
        # left that policy on the old address and every desktop upload failed with "the connection
        # dropped". The rule now lives in infra/r2/document-storage-cors-rule.json and is applied on
        # every deploy; rules other than ours are kept as they are.
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_DOCUMENT_BUCKETS: verigence-di-bucket-dev
          RULE_FILE: infra/r2/document-storage-cors-rule.json
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets"
          rule_id="$(jq -r '.id' "$RULE_FILE")"
          for bucket in $R2_DOCUMENT_BUCKETS; do
            # The bucket must be the one Audit Core keeps documents in.
            if curl --silent --max-time 30 --header "Authorization: Bearer $CF_TOKEN" \
                 "$api/$bucket/objects?prefix=p2-&per_page=1" | jq -e '.success == true and ((.result // []) | length) > 0' >/dev/null; then
              echo "DOCUMENT_BUCKET=PASS|$bucket holds Audit Core documents"
            else
              echo "::warning::Could not confirm $bucket holds Audit Core documents (p2- prefix); applying the rule anyway"
            fi

            current="$(curl --silent --max-time 30 --header "Authorization: Bearer $CF_TOKEN" "$api/$bucket/cors")"
            # Only write when the current policy was read (or the bucket has none), so a failed
            # read can never wipe rules other than ours.
            echo "$current" | jq -e '.success == true or ((.errors // []) | map(.code) | index(10059))' >/dev/null || {
              echo "::error::Could not read the CORS policy on $bucket; not changing it"; echo "$current" | jq -c '.errors'; exit 1; }
            echo "Current CORS on $bucket:"; echo "$current" | jq -c '.result.rules // []'
            body="$(jq -n --argjson cur "$current" --slurpfile mine "$RULE_FILE" --arg id "$rule_id" \
              '{rules: ((($cur.result.rules // []) | map(select(.id != $id))) + $mine)}')"
            put="$(curl --silent --max-time 30 --request PUT --header "Authorization: Bearer $CF_TOKEN" \
              --header 'Content-Type: application/json' --data "$body" "$api/$bucket/cors")"
            echo "$put" | jq -e '.success == true' >/dev/null || {
              echo "::error::Could not set the CORS policy on $bucket"; echo "$put" | jq -c '.errors'; exit 1; }
            echo "R2_CORS_APPLIED=PASS|$bucket"

            # What a browser does before the PUT: every address must be allowed.
            endpoint="https://$CF_ACCOUNT.r2.cloudflarestorage.com/$bucket/p2-bulk/cors-check"
            for origin in $(jq -r '.allowed.origins[]' "$RULE_FILE"); do
              ok=""
              for attempt in $(seq 1 12); do
                if curl --silent --max-time 20 --dump-header - --output /dev/null --request OPTIONS \
                     --header "Origin: $origin" --header 'Access-Control-Request-Method: PUT' \
                     --header 'Access-Control-Request-Headers: content-type' "$endpoint" \
                   | grep -Fqi "access-control-allow-origin: $origin"; then ok=1; break; fi
                sleep 10
              done
              [ -n "$ok" ] || { echo "::error::$bucket does not accept uploads from $origin"; exit 1; }
              echo "R2_UPLOAD_PREFLIGHT=PASS|$bucket|$origin"
            done
          done

      - name: Smoke test deployed Web and backend proxies
        env:
          DEV_WEB_URL: https://verigence-web-dev.jbrconsulting-it.workers.dev
        run: |
          set -euo pipefail
          sleep 5
          cache_bust="deploy=$GITHUB_SHA"

          echo "--- Login page (cache-busted) ---"
          curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache' \
            --header 'Pragma: no-cache' \
            --dump-header /tmp/login.headers \
            --output /tmp/login.html \
            "$DEV_WEB_URL/login?$cache_bust"
          head -n 20 /tmp/login.headers

          asset_path="$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/login.html | head -n 1 | sed -E 's/^src="([^"]+)"$/\1/')"
          [ -n "$asset_path" ] || {
            echo "Could not resolve deployed JavaScript asset from login page"
            cat /tmp/login.html
            exit 1
          }
          curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache' \
            --output /tmp/app.js \
            "$DEV_WEB_URL$asset_path?$cache_bust"
          [ -s /tmp/app.js ] || {
            echo "Deployed application entry JavaScript is empty"
            exit 1
          }
          echo "WEB_ENTRY_ASSET_DEPLOYED=PASS|$asset_path"

          # A hashed asset can lag the entry chunk by a few seconds at the
          # edge right after a deploy; until it lands the Worker answers the
          # asset path with index.html (HTTP 200), so --fail passes and the
          # content check fails. Seen twice on 2026-09-28 (the DI console
          # chunk at 06:22, the logo chunk at 07:47), each fine on the next
          # deploy. Wait for the content, not just a 200.
          fetch_asset_with() {
            local asset="$1" marker="$2" out="$3" attempt
            for attempt in $(seq 1 12); do
              curl --fail --silent --show-error --location \
                --header 'Cache-Control: no-cache' \
                --header 'Pragma: no-cache' \
                --output "$out" \
                "$DEV_WEB_URL$asset?$cache_bust&try=$attempt" || true
              if [ -s "$out" ] && grep -q "$marker" "$out"; then
                return 0
              fi
              echo "Deployed asset $asset not ready yet (attempt $attempt)"
              sleep 5
            done
            return 1
          }

          echo "--- Approved logo deployed chunk ---"
          logo_chunk="$(grep -Rl 'data:image/png;base64,' dist/assets --include='*.js' | head -n 1)"
          [ -n "$logo_chunk" ] || {
            echo 'Could not identify the built JavaScript chunk containing the approved PNG lockup.'
            exit 1
          }
          logo_asset="/assets/$(basename "$logo_chunk")"
          fetch_asset_with "$logo_asset" 'data:image/png;base64,' /tmp/logo-chunk.js || {
            echo "Deployed logo-bearing chunk does not contain the approved bundled PNG lockup: $logo_asset"
            exit 1
          }
          echo "VERIGENCE_LOGO_DEPLOYED_BUNDLE=PASS|$logo_asset"

          echo "--- DI Test Console deployed chunk ---"
          di_chunk="$(find dist/assets -maxdepth 1 -type f -name 'DiTestConsolePage-*.js' | head -n 1)"
          di_asset="/assets/$(basename "$di_chunk")"
          fetch_asset_with "$di_asset" 'DI Test Console' /tmp/di-test-console.js || {
            echo 'Deployed DI Test Console asset does not match the built console chunk.'
            exit 1
          }
          echo "DI_TEST_CONSOLE_DEPLOYED_BUNDLE=PASS|$di_asset"

          echo "--- DI direct-browser CORS preflight ---"
          curl --fail --silent --show-error \
            --dump-header /tmp/di-cors.headers \
            --output /dev/null \
            --request OPTIONS \
            --header "Origin: $DEV_WEB_URL" \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type,authorization' \
            "$DI_UPSTREAM/v1/tenants/70c5661e-bab2-46e7-8199-0f9c32acbac3/subjects"
          if ! grep -Eqi '^access-control-allow-origin: (\*|https://verigence-web-dev\.jbrconsulting-it\.workers\.dev)' /tmp/di-cors.headers; then
            echo 'DI DEV did not allow the Web DEV origin for direct browser API testing.'
            cat /tmp/di-cors.headers
            exit 1
          fi
          echo 'DI_TEST_CONSOLE_CORS=PASS'

          echo "--- Security login route via Worker ---"
          SECURITY_STATUS="$(curl --silent --show-error \
            --dump-header /tmp/security.headers \
            --output /tmp/security.body \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$DEV_WEB_URL/security/v1/auth/login")"
          cat /tmp/security.headers
          cat /tmp/security.body
          echo
          echo "Security smoke status: $SECURITY_STATUS"

          if ! grep -qi '^x-verigence-proxy: security' /tmp/security.headers; then
            echo "Request did not pass through the Verigence Security Worker proxy"
            exit 1
          fi

          case "$SECURITY_STATUS" in
            400|401|422) ;;
            *)
              echo "Security login route is not healthy through the Worker proxy"
              exit 1
              ;;
          esac

          echo "--- Audit Core health via Worker ---"
          curl --fail --silent --show-error \
            --dump-header /tmp/audit-health.headers \
            --output /tmp/audit-health.body \
            "$DEV_WEB_URL/audit-core/health"
          cat /tmp/audit-health.headers
          cat /tmp/audit-health.body
          echo
          if ! grep -qi '^x-verigence-proxy: audit-core' /tmp/audit-health.headers; then
            echo 'Audit Core health request did not pass through the Audit Core Worker proxy.'
            exit 1
          fi
          echo 'AUDIT_CORE_PROXY_HEALTH=PASS'

          echo "--- Project Administration route via Audit Core Worker proxy ---"
          PROJECTS_STATUS="$(curl --silent --show-error \
            --dump-header /tmp/projects.headers \
            --output /tmp/projects.body \
            --write-out '%{http_code}' \
            "$DEV_WEB_URL/audit-core/v1/projects")"
          cat /tmp/projects.headers
          cat /tmp/projects.body
          echo
          if ! grep -qi '^x-verigence-proxy: audit-core' /tmp/projects.headers; then
            echo 'Project Administration request did not pass through the Audit Core Worker proxy.'
            exit 1
          fi
          case "$PROJECTS_STATUS" in
            401|403) ;;
            *)
              echo "Unauthenticated Project Administration proxy smoke returned HTTP $PROJECTS_STATUS"
              exit 1
              ;;
          esac
          echo 'PROJECT_ADMIN_PROXY_ROUTE=PASS'

          echo "--- Capacitor CORS preflight ---"
          for origin in 'capacitor://localhost' 'https://localhost'; do
            curl --fail --silent --show-error \
              --dump-header /tmp/cors.headers \
              --output /dev/null \
              --request OPTIONS \
              --header "Origin: $origin" \
              --header 'Access-Control-Request-Method: POST' \
              --header 'Access-Control-Request-Headers: content-type,authorization,x-onboarding-key' \
              "$DEV_WEB_URL/security/v1/auth/login"
            if ! grep -Fqi "access-control-allow-origin: $origin" /tmp/cors.headers; then
              echo "Capacitor origin $origin was not allowed by the Security proxy"
              cat /tmp/cors.headers
              exit 1
            fi
          done
          echo "CAPACITOR_SECURITY_CORS=PASS"
