name: UC03 C1 Web DEV Validation

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/uc03-c1-dev-validation.yml'

permissions:
  contents: read
  deployments: write

concurrency:
  group: uc03-c1-web-dev-validation
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy C1 Web branch to Cloudflare DEV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_SHA: ${{ github.event.pull_request.head.sha }}
      SECURITY_UPSTREAM: https://security-dev.up.railway.app
      DEV_WEB_URL: https://verigence-web-dev.jbrconsulting-it.workers.dev

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verify C1 source boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q 'uc03-workspace' src
          grep -R -q 'booking/extraction/refresh' src
          grep -R -q 'close-ready' src
          grep -R -q 'EXCHANGE_TAKEN' src
          echo 'WEB_C1_SOURCE_CONTRACT=PASS'
      - name: Build exact C1 Web revision
        run: npm run build
        env:
          VITE_SECURITY_BASE_URL: ""
          VITE_AUDIT_CORE_BASE_URL: ${{ secrets.AUDIT_CORE_URL }}
      - name: Deploy to Cloudflare DEV
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Smoke deployed C1 Web
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error --location --output /tmp/login.html "$DEV_WEB_URL/login"
          curl --fail --silent --show-error --location --output /tmp/booking.html "$DEV_WEB_URL/bookings/00000000-0000-0000-0000-000000000001"
          asset_path="$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/login.html | head -n 1 | sed -E 's/^src="([^"]+)"$/\1/')"
          [ -n "$asset_path" ] || { echo '::error::Cannot resolve deployed JS asset'; exit 1; }
          curl --fail --silent --show-error --location --output /tmp/app.js "$DEV_WEB_URL$asset_path"
          grep -q 'uc03-workspace' /tmp/app.js || { echo '::error::Deployed JS is missing C1 workspace contract'; exit 1; }
          grep -q 'booking/extraction/refresh' /tmp/app.js || { echo '::error::Deployed JS is missing C1 extraction refresh contract'; exit 1; }
          echo 'WEB_C1_DEPLOYED_BUNDLE=PASS'
          security_status="$(curl --silent --show-error --dump-header /tmp/security.headers --output /tmp/security.body --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{}' "$DEV_WEB_URL/security/v1/auth/login")"
          grep -qi '^x-verigence-proxy: security' /tmp/security.headers || { cat /tmp/security.headers; exit 1; }
          case "$security_status" in 400|401|422) ;; *) cat /tmp/security.body; exit 1 ;; esac
          echo 'WEB_SECURITY_PROXY=PASS'
          echo "WEB_C1_DEPLOYED_SHA=$DEPLOY_SHA"
