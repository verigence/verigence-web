name: Verify UC02 DEV release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'verify/uc02-dev-release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEV_WEB_URL: https://verigence-web-dev.jbrconsulting-it.workers.dev
    steps:
      - name: Verify deployed UC02 Web bundle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output /tmp/login.html \
            "$DEV_WEB_URL/login"
          asset_path="$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/login.html | head -n 1 | sed -E 's/^src="([^"]+)"$/\1/')"
          [ -n "$asset_path" ] || { echo 'Could not resolve deployed JS asset'; exit 1; }
          curl --fail --silent --show-error --location \
            --output /tmp/app.js \
            "$DEV_WEB_URL$asset_path"
          grep -q 'Project administration' /tmp/app.js || {
            echo 'UC02 Project administration marker is not present in deployed Web bundle'
            exit 1
          }
          curl --fail --silent --show-error --location \
            --output /tmp/admin.html \
            "$DEV_WEB_URL/admin/project"
          echo 'UC02_WEB_DEV=PASS'

      - name: Verify deployed Audit Core UC02 contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          source=Path('/tmp/app.js').read_text(errors='ignore')
          origins=sorted(set(re.findall(r'https://[A-Za-z0-9._:-]+', source)))
          candidates=origins + [
              'https://audit-core-dev.up.railway.app',
              'https://auditcore-dev.up.railway.app',
              'https://verigence-audit-core-dev.up.railway.app',
              'https://verigence-audit-core.up.railway.app',
              'https://audit-core.up.railway.app',
              'https://audit-dev.up.railway.app',
          ]
          candidates=list(dict.fromkeys(candidates))
          Path('/tmp/origins.txt').write_text('\n'.join(candidates))
          print('DEPLOYED_HTTPS_ORIGINS:')
          for origin in origins:
              print(origin)
          PY

          found=''
          while IFS= read -r base; do
            [ -n "$base" ] || continue
            if ! curl --connect-timeout 4 --max-time 8 --fail --silent --show-error \
              "$base/health" >/tmp/audit-health.json 2>/dev/null; then
              continue
            fi
            if ! curl --connect-timeout 4 --max-time 8 --fail --silent --show-error \
              "$base/openapi.json" >/tmp/openapi.json 2>/dev/null; then
              continue
            fi
            if python - <<'PY'
          import json
          from pathlib import Path
          try:
              spec=json.loads(Path('/tmp/openapi.json').read_text())
          except Exception:
              raise SystemExit(1)
          paths=spec.get('paths', {})
          required=[
              '/v1/projects',
              '/v1/tenants/{tenant_id}/project/readiness',
              '/v1/tenants/{tenant_id}/project/activate',
              '/v1/tenants/{tenant_id}/project-masters',
              '/v1/tenants/{tenant_id}/role-mapping-candidates',
              '/v1/tenants/{tenant_id}/role-mappings',
          ]
          raise SystemExit(0 if all(path in paths for path in required) else 1)
          PY
            then
              found="$base"
              break
            fi
          done </tmp/origins.txt

          [ -n "$found" ] || {
            echo 'No candidate service exposes the required UC02 Audit Core contract'
            exit 1
          }
          echo "AUDIT_CORE_DISCOVERED=$found"
          echo 'AUDIT_CORE_HEALTH=PASS'
          echo 'AUDIT_CORE_UC02_DEV=PASS'
